    <path d="M720 185 L820 235 L930 170 L1040 235 L1140 195"/>
    <path d="M790 300 L870 255 L980 305 L1080 255 L1160 290"/>
    <path d="M850 125 L820 235 L870 255"/>
    <path d="M960 78 L930 170 L980 305"/>
    <path d="M1060 145 L1040 235 L1080 255"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="760" cy="72" r="4"/><circle cx="850" cy="125" r="5"/>
    <circle cx="960" cy="78" r="4"/><circle cx="1060" cy="145" r="5"/>
    <circle cx="1140" cy="95" r="4"/><circle cx="720" cy="185" r="4"/>
    <circle cx="820" cy="235" r="5"/><circle cx="930" cy="170" r="6"/>
    <circle cx="1040" cy="235" r="4"/><circle cx="1140" cy="195" r="5"/>
    <circle cx="790" cy="300" r="4"/><circle cx="870" cy="255" r="5"/>
    <circle cx="980" cy="305" r="4"/><circle cx="1080" cy="255" r="5"/>
    <circle cx="1160" cy="290" r="4"/>
