  <text x="72" y="105" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="5">AI &amp; BIG DATA ENGINEERING</text>
  <text x="68" y="176" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Oyéolouwa</text>
  <text x="68" y="235" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">ASSOGBA</text>
  <rect x="72" y="260" width="300" height="3" rx="2" fill="url(#glow)"/>
  <text x="72" y="300" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Building intelligence. Discovering patterns.</text>
  <text x="72" y="330" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">ESIGELEC · POITIERS, FRANCE</text>
